<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Product Showcase</h1>
    </header>

    <main class="product-container">
        <!-- Card 1-->
        <div class="product-card">
            
            <img src="blush.jpg" alt="NYX plush blush">
            <h2>NYX plush blush</h2>
            <p>R300</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 2-->
        <div class="product-card">
            
            <img src="eye patches.png" alt="eye patches"
            <h2>Eye patches</h2>
            <p>R450</p>
            <button>Add to Cart</button>
            </div>
        <!-- Card 3-->
        <div class="product-card">
            
            <img src="SUNSCREEN.jpeg" alt="sunscreen"
            <h2>Eucerin SPF30</h2>
            <p>R500</p>
            <button>Add to Cart</button>
            </div>

        <!-- Card 4-->
        <div class="product-card">
            
            <img src="translucent powder.jpg" alt="translucent powder"
            <h2>Translucent powder</h2>
            <p>R250</p>
            <button>Add to Cart</button>
            </div>

        <!-- Card 5-->
        <div class="product-card">
            
            <img src="lip balm.jpg" alt="lip balm"
            <h2>Rhode lip balm</h2>
            <p>R550</p>
            <button>Add to Cart</button>
            </div>

        <!-- Card 6-->
        <div class="product-card">
            
            <img src="tote.png" alt="Tote bag"
            <h2>Brown Tote Bag</h2>
            <p>R700</p>
            <button>Add to Cart</button>
            </div>

        </main>
</body>
</html>
